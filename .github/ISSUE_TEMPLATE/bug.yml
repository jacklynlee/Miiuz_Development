name: Bug report
description: Something in the app is broken or wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Plan tab
        2. Pick Penang, 13:00–18:30
        3. Tap Generate route
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Home, Search / place pages, Guide, Plan, Tools, Ask Miiuz (AI), SOS, Members, Maps / photos, Languages / translation, Install / offline, Other]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device, browser and app language
      placeholder: iPhone 15, Safari, 简体中文
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or links
