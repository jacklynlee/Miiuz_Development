<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- preview:start -->
<title>Miiuz Beyond Borders</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Miiuz Beyond Borders (Miiuz BB) · Cuti-cuti Malaysia! Search any place in Malaysia, with maps, photos, entry and transport tips, food, souvenirs, day plans, phrases, emergency help and an AI assistant.">
<meta name="theme-color" content="#0d6662" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17211e" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="copyright" content="© 2026 Miiuz Beyond Borders Sdn. Bhd. All rights reserved.">
<!-- pwa:start -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Miiuz BB">
<!-- pwa:end -->
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="tiles" aria-hidden="true"></div>

<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="#home" aria-label="Miiuz Beyond Borders">
      <svg class="mark" viewBox="0 0 56 56" aria-hidden="true">
        <circle cx="28" cy="28" r="25" fill="none" stroke="var(--teal)" stroke-width="3"/>
        <circle cx="28" cy="28" r="18" fill="var(--teal-soft)"/>
        <path d="M6 40 L50 16" stroke="var(--hibiscus)" stroke-width="3" stroke-dasharray="5 4" stroke-linecap="round"/>
        <circle cx="40" cy="21.5" r="4" fill="var(--turmeric)"/>
      </svg>
      <span class="brand-name">Miiuz <b>BB</b><small>Beyond Borders</small></span>
    </a>
    <div class="top-actions">
      <label class="lang-pick" for="lang-select">
        <span class="sr-only" data-i18n="lang.label">Language</span>
        <span class="lang-ic" data-icon="globe"></span>
        <span class="lang-short" id="lang-short" aria-hidden="true">EN</span>
        <select id="lang-select"></select>
      </label>
      <button type="button" class="member-btn" id="member-btn" data-i18n-aria="member.join"></button>
      <button type="button" class="sos-btn" id="sos-open" aria-haspopup="dialog">SOS</button>
    </div>
  </div>
</header>
<div class="trbar" id="trbar" role="status" hidden></div>
<div class="trbar warn wxbar" id="wxbar" role="note" hidden></div>
<div class="trbar updbar" id="updbar" role="status" hidden></div>

<nav class="tabbar" data-i18n-aria="nav.label">
  <div class="tabbar-in">
    <a href="#home" data-tab="home"><span class="tab-ic" data-icon="home"></span><span data-i18n="nav.home">首页</span></a>
    <a href="#explore" data-tab="explore"><span class="tab-ic" data-icon="compass"></span><span data-i18n="nav.explore">探索</span></a>
    <a href="#guide" data-tab="guide"><span class="tab-ic" data-icon="guide"></span><span data-i18n="nav.guide">指南</span></a>
    <a href="#trip" data-tab="trip"><span class="tab-ic" data-icon="trip"></span><span data-i18n="nav.trip">行程</span></a>
    <a href="#tools" data-tab="tools"><span class="tab-ic" data-icon="tools"></span><span data-i18n="nav.tools">工具</span></a>
  </div>
</nav>

<main class="wrap" id="main">
  <section class="view" id="view-home" data-view="home"></section>

  <section class="view" id="view-explore" data-view="explore" hidden></section>

  <section class="view" id="view-guide" data-view="guide" hidden></section>

  <section class="view" id="view-plan" data-view="plan" hidden>
    <a class="back" href="#trip"><span data-icon="back"></span><span data-i18n="trip.title">我的行程</span></a>
    <div class="view-head">
      <h1 data-i18n="plan.title">行程规划</h1>
      <p data-i18n="plan.lead"></p>
    </div>
    <div class="plan-grid">
      <form class="panel" id="prefs" autocomplete="off">
        <fieldset>
          <legend data-i18n="plan.city">城市</legend>
          <div class="chips" id="p-city"></div>
        </fieldset>
        <fieldset>
          <legend data-i18n="plan.time">时间</legend>
          <div class="row">
            <label for="p-start"><span data-i18n="plan.start">出发时间</span><input type="time" id="p-start" value="13:00"></label>
            <label for="p-end"><span data-i18n="plan.end">最晚结束</span><input type="time" id="p-end" value="18:30"></label>
          </div>
          <label class="toggle" for="p-flight-on"><input type="checkbox" id="p-flight-on"> <span data-i18n="plan.flightToggle"></span></label>
          <div class="row" id="p-flight-row" hidden>
            <label for="p-flight"><span data-i18n="plan.flight">起飞时间</span><input type="time" id="p-flight" value="22:30"></label>
          </div>
          <p class="hint" id="p-flight-hint"></p>
        </fieldset>
        <fieldset>
          <legend data-i18n="plan.persona">旅行性格</legend>
          <div class="persona" id="p-persona"></div>
        </fieldset>
        <fieldset>
          <legend><span data-i18n="plan.themes">想要的主题</span> <small data-i18n="plan.themesSub"></small></legend>
          <div class="chips" id="p-themes"></div>
        </fieldset>
        <fieldset>
          <legend data-i18n="plan.group">和谁一起</legend>
          <div class="chips" id="p-group"></div>
        </fieldset>
        <fieldset>
          <legend data-i18n="plan.budget">预算</legend>
          <div class="chips" id="p-budget"></div>
        </fieldset>
        <fieldset>
          <legend data-i18n="plan.options">其他</legend>
          <label class="toggle" for="p-rain"><input type="checkbox" id="p-rain"> <span data-i18n="plan.rain"></span></label>
          <label class="toggle" for="p-nowalk"><input type="checkbox" id="p-nowalk"> <span data-i18n="plan.nowalk"></span></label>
          <label class="toggle" for="p-stay" id="p-stay-row" hidden><input type="checkbox" id="p-stay" checked> <span id="p-stay-label"></span></label>
        </fieldset>
        <div class="actions">
          <button type="submit" class="btn btn-main" data-i18n="plan.go">生成路线</button>
          <button type="button" class="btn btn-ghost" id="p-shuffle" data-i18n="plan.shuffle">换一条路线</button>
        </div>
      </form>

      <div class="plan-out" aria-live="polite">
        <div class="summary" id="p-summary"></div>
        <ol class="timeline" id="p-timeline"></ol>
        <div class="actions">
          <button type="button" class="btn btn-ghost" id="p-copy" data-i18n="plan.copy">复制行程</button>
          <button type="button" class="btn btn-ghost" id="p-undo" data-i18n="plan.undo" hidden>恢复原路线</button>
          <a class="btn btn-ghost" href="#tours" id="p-car"><span data-icon="car"></span><span data-i18n="plan.bookCar">为这条路线包车</span></a>
          <a class="btn btn-ai" href="#ask" id="p-ask"><span data-icon="spark"></span><span data-i18n="plan.askEdit">让 Miiuz 帮我改</span></a>
        </div>
      </div>
    </div>
  </section>

  <section class="view" id="view-trip" data-view="trip" hidden></section>

  <section class="view" id="view-tools" data-view="tools" hidden></section>

  <section class="view" id="view-stays" data-view="stays" hidden></section>

  <section class="view" id="view-tours" data-view="tours" hidden></section>

  <section class="view" id="view-member" data-view="member" hidden></section>

  <section class="view" id="view-search" data-view="search" hidden></section>

  <section class="view" id="view-place" data-view="place" hidden></section>

  <section class="view" id="view-credits" data-view="credits" hidden></section>

  <section class="view" id="view-ask" data-view="ask" hidden>
    <div class="card ask-soon" id="ask-soon" hidden>
      <span class="chat-avatar" data-icon="spark"></span>
      <p><span class="pill teal" data-i18n="ask.soon">即将推出</span></p>
      <h1 data-i18n="ask.title">Miiuz 旅行助手</h1>
      <p data-i18n="ask.soonLead"></p>
      <div class="actions">
        <a class="btn btn-ai" href="#guide" data-i18n="ask.soonGuide">看旅行指南</a>
        <a class="btn btn-ghost" href="#plan" data-i18n="home.q.plan">排一条今天的路线</a>
      </div>
    </div>
    <div class="chat" id="chat">
      <div class="chat-head">
        <div class="chat-title">
          <span class="chat-avatar" data-icon="spark"></span>
          <div><h1 data-i18n="ask.title">Miiuz 旅行助手</h1><p data-i18n="ask.lead"></p></div>
        </div>
        <div class="chat-controls">
          <label for="c-lang"><span data-i18n="ask.lang">回复语言</span>
            <select id="c-lang"></select>
          </label>
          <button type="button" class="btn btn-ghost btn-sm" id="c-new" data-i18n="ask.newChat">新对话</button>
        </div>
      </div>
      <div class="msgs" id="c-msgs" aria-live="polite"></div>
      <div class="suggest" id="c-suggest"></div>
      <form class="composer" id="c-form">
        <label class="sr-only" for="c-input" data-i18n="ask.ph"></label>
        <textarea id="c-input" rows="2" data-i18n-ph="ask.ph"></textarea>
        <button type="submit" class="btn btn-ai" id="c-send" data-i18n="ask.send">发送</button>
        <button type="button" class="btn btn-ghost" id="c-stop" data-i18n="ask.stop" hidden>停止</button>
      </form>
      <p class="chat-foot" id="c-foot"></p>
    </div>
  </section>

  <footer class="foot">
    <b>MIIUZ BEYOND BORDERS · <span lang="ms">Cuti-cuti Malaysia!</span></b>
    <span data-i18n="app.footer"></span>
    <a href="#credits" data-i18n="app.credits">Photo &amp; map credits</a>
    <small class="copy" lang="en">© 2026 Miiuz Beyond Borders Sdn. Bhd. All rights reserved.</small>
  </footer>
</main>

<div class="sheet-backdrop" id="sos" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sos-title" id="sos-sheet"></div>
</div>
<div class="sheet-backdrop" id="nudge" hidden></div>
<div class="present" id="present" hidden></div>
<div class="present must-update" id="must-update" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="sr-only" id="toast-polite" role="status"></div>
<div class="sr-only" id="toast-alert" role="alert"></div>

<script src="js/data/malaysia.js"></script>
<script src="js/data/malaysia.explore.js"></script>
<script src="js/data/malaysia.map.js"></script>
<script src="js/data/malaysia.ko.js"></script>
<script src="js/data/malaysia.ja.js"></script>
<script src="js/i18n.js"></script>
<script src="js/locales.js"></script>
<script src="js/country.js"></script>
<script src="js/core.js"></script>
<script src="js/i18n-entries.js"></script>
<script src="js/ai.js"></script>
<script src="js/prompt.js"></script>
<script src="js/translate.js"></script>
<script src="js/guide.js"></script>
<script src="js/planner.js"></script>
<script src="js/tools.js"></script>
<script src="js/chat.js"></script>
<script src="js/install.js"></script>
<script src="js/update.js"></script>
<script src="js/member.js"></script>
<script src="js/media.js"></script>
<script src="js/picks.js"></script>
<script src="js/maps.js"></script>
<script src="js/search.js"></script>
<script src="js/place.js"></script>
<script src="js/explore.js"></script>
<script src="js/trip.js"></script>
<script src="js/book.js"></script>
<script src="js/app.js"></script>

     claude.ai preview leaves it out. Served by Vercel once Analytics is enabled; a no-op on the local server. -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  // Send only the page and the app screen (#guide-money). Never sign-in tokens (#access_token=…) or invite codes (?ref=).
  window.va("beforeSend", function (e) {
    try { var u = new URL(e.url); return Object.assign({}, e, { url: u.origin + u.pathname + (/^#[a-z][\w-]*$/.test(u.hash) ? u.hash : "") }); }
    catch (err) { return null; }
  });
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
